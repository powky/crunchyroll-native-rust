[workspace]
resolver = "3"
members = ["crates/core", "crates/player", "crates/tv"]

[workspace.package]
edition = "2024"
version = "1.0.1"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

# crunchyroll-rs with one field more: the stream's seek thumbnails (vendor/crunchyroll-rs/PATCHED.md)
[patch.crates-io]
crunchyroll-rs = { path = "vendor/crunchyroll-rs" }
